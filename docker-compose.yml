services:
  backrest-init:
    image: ghcr.io/garethgeorge/backrest@sha256:9c9966b5c285ec791a6b06cb4545fa0247424d05442e12f9558b4322d9f8a15f
    restart: "no"
    userns_mode: host
    network_mode: none
    command:
      - /bin/sh
      - -c
      - chown -R 175200010:175200010 /data /config /cache /tmp && chmod g+r /vault-unseal/key
    volumes:
      - data:/data
      - configuration:/config
      - cache:/cache
      - tmp:/tmp
      - type: bind
        source: /var/lib/docker/100000.100000/volumes/infra_vault_unseal/_data/key
        target: /vault-unseal/key
        bind:
          create_host_path: false

  backrest:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: limits-large
    image: ghcr.io/garethgeorge/backrest@sha256:9c9966b5c285ec791a6b06cb4545fa0247424d05442e12f9558b4322d9f8a15f
    restart: unless-stopped
    # userns_mode: host is required for backing up remapped Docker volume paths.
    userns_mode: host
    user: "175200010:175200010"
    # Vault container GID 100 maps to host GID 100100.
    group_add:
      - "100100"
    cpu_shares: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      backrest-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "-o",
          "/dev/null",
          "http://127.0.0.1:9898/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Europe/Zurich
      - BACKREST_PORT=0.0.0.0:9898
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp

    secrets:
      - backrest_b2_account_id
      - backrest_b2_account_key
      - backrest_repo_password

    command:
      - /bin/sh
      - /bootstrap/render-config.sh

    volumes:
      # 1. STATE:
      - data:/data
      - configuration:/config
      - cache:/cache
      - tmp:/tmp

      # 2. BOOTSTRAP:
      - ./backrest/config.template.json:/bootstrap/config.template.json:ro
      - ./backrest/render-config.sh:/bootstrap/render-config.sh:ro

      # 3. SOURCE DATA (exact host paths only):
      # /export/Documents is an automounted NFS filesystem from a machine that
      # is not always on. Bind its stable parent without triggering the mount;
      # rslave propagates the NFS submount if it becomes available later.
      # Do not let Docker create placeholder host paths when sources are absent.
      - type: bind
        source: /var/lib/docker/100000.100000/volumes/paperless-ai_export/_data
        target: /source/var/lib/docker/100000.100000/volumes/paperless-ai_export/_data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/docker/100000.100000/volumes/infra_vault_unseal/_data/key
        target: /source/var/lib/docker/100000.100000/volumes/infra_vault_unseal/_data/key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /scratch/backup/vault
        target: /source/scratch/backup/vault
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /export
        target: /source/export
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backrest.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.backrest.entrypoints=https"
      - "traefik.http.routers.backrest.tls=true"
      - "traefik.http.routers.backrest.service=backrest"
      - "traefik.http.routers.backrest.middlewares=authelia@docker"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"

    networks:
      - traefik_proxy


volumes:
  data:
  configuration:
  cache:
  tmp:

networks:
  traefik_proxy:
    external: true

secrets:
  backrest_b2_account_id:
    file: secrets/backrest_b2_account_id
  backrest_b2_account_key:
    file: secrets/backrest_b2_account_key
  backrest_repo_password:
    file: secrets/backrest_repo_password
